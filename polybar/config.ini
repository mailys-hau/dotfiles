[settings]
screenchange-reload = true
pseudo-transparency = false
; Do not blend colour, because we have transparency
compositing-background = source
compositing-foreground = source


[colors]
transparent = #00000000
; Gruvbox blue
accent      = #E6458588
foreground  = #E8ECEF
disabled    = #87929D

; Colours based on background
white           = #F9F2CE

yellow          = #EFE29E
; Gruvbox colour
dark-yellow     = #D79921
red             = #C01006
dark-red        = #D9600803

milk-chocolate  = #B0611F
muted-brown     = #86572f
chocolate       = #D96E260C
dark-brown      = #D94B1F0F



[bar/main]
width = 100%
height = 20pt
bottom = true
monitor = ${env:MONITOR:}

background = ${colors.transparent}
foreground = ${colors.white}

; separator = "|"

line-size = 2pt
border-size = 0

padding-left = 0
padding-right = 0
module-margin = 0

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = Symbols Nerd Font Mono:size=20;4
font-2 = Noto Color Emoji:scale=10;2

modules-left = i3 
; modules-center = xwindow
modules-right = sep-trans sound music microphone sep-music temperature sep-dark nvidia sep-choco cpu memory sep-dark rootfs homefs sep-choco keyboard sep-dark battery backlight sep-choco tray sep-dark time weather

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

override-redirect = false
wm-restack = i3


; Tray should not show on secondary monitor
[bar/secondary]
inherit = bar/main
modules-right = sep-trans sound music microphone sep-music temperature sep-dark nvidia sep-choco cpu memory sep-dark rootfs homefs sep-choco keyboard sep-dark battery backlight time weather


; Pretty separators
[module/sep]
type                = custom/text
label               = "%{T2}%{T-}"
format              = <label>
format-padding      = 0
format-offset       = -1
format-margin       = 0

[module/sep-dark]
inherit             = module/sep
format-foreground   = ${colors.dark-brown}
format-background   = ${colors.chocolate}

[module/sep-choco]
inherit             = module/sep
format-foreground   = ${colors.chocolate}
format-background   = ${colors.dark-brown}

[module/sep-trans]
inherit             = module/sep
format-foreground   = ${colors.dark-red}
format-background   = ${colors.transparent}

[module/sep-music]
inherit             = module/sep
format-foreground   = ${colors.chocolate}
format-background   = ${colors.dark-red}


[module/i3]
type = internal/i3

pin-workspaces = true
show_urgent = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
strip-wsnumbers = true

format = <label-state><label-mode>
format-background = ${colors.muted-brown}

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.dark-red}

; Active workspace on primary monitor
label-focused = %index%
label-focused-padding = 2
label-focused-underline = ${colors.white}
label-focused-background = ${colors.dark-brown}

; Active workspace on external monitor
label-visible = %index%
label-visible-padding = 2
label-visible-background = ${colors.dark-brown}

; Existing & unfocused workspace
label-unfocused = %index%
label-unfocused-padding = 1
label-unfocused-background = ${colors.muted-brown}

label-urgent = %index%
label-urgent-padding = 3
label-urgent-foreground = ${colors.dark-yellow}




; The original sound block displays only the current output icon.
[module/sound]
type = custom/script
;exec = sh -c 'pactl get-sink-mute @DEFAULT_SINK@ 2>/dev/null | grep -q yes && echo "󰝟" || { pactl list sinks 2>/dev/null | grep -A25 "$(pactl get-default-sink)" | grep -qi "active port.*headphone" && echo "󰋋" || echo "󰕾"; }'
exec = ~/.config/polybar/scripts/sound-icon.sh
interval = 2
format = <label>
format-background = ${colors.dark-red}
label = " %output% "

click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

; Equivalent to: $icon {$combo.str(max_w:21) $play $next |}
[module/music]
type = custom/script
;exec = sh -c 's=$(playerctl status 2>/dev/null) || { printf "\n"; exit 0; }; t=$(playerctl metadata --format "{{artist}} - {{title}}" 2>/dev/null | cut -c1-21); [ "$s" = Playing ] && p="󰏤" || p="󰐊"; printf "󰎈 %s %s 󰒭\n" "$t" "$p"'
exec = bash -c 'w=21; i=0; while :; do s=$(playerctl status 2>/dev/null) || { echo; sleep 1; continue; }; t=$(playerctl metadata --format "{{artist}} - {{title}}" 2>/dev/null); [ "$s" = Playing ] && p="󰏤" || p="󰐊"; n=$(printf %s "$t   " | wc -m); if (( n <= w + 3 )); then v="$t"; else cycle="$t   "; buf="$cycle$cycle$cycle"; off=$((i % n + 1)); end=$((off + w - 1)); v=$(printf %s "$buf" | cut -c"$off-$end"); i=$((i + 1)); fi; echo "󰎈 $v $p 󰒭"; sleep 0.5; done'
tail = true

format = <label>
format-background = ${colors.dark-red}
label = " %output% "

click-left = playerctl play-pause
click-right = playerctl next
scroll-up = playerctl volume 0.05+
scroll-down = playerctl volume 0.05-

[module/microphone]
type = custom/script
exec = sh -c 'pactl get-source-mute @DEFAULT_SOURCE@ 2>/dev/null | grep -q yes && echo "󰍭" || echo "󰍬"'
interval = 2
format = <label>
format-background = ${colors.dark-red}
label = " %output% "
click-right = pactl set-source-mute @DEFAULT_SOURCE@ toggle


[module/temperature]
type = internal/temperature
interval = 2
format = <label>
format-background = ${colors.chocolate}
label = " 󰔏 "
format-warn = <label-warn>
format-warn-background = ${colors.dark-yellow}
label-warn = " 󰸁 %temperature-c% "
warn-temperature = 70
units = true


[module/nvidia]
type = custom/script
exec-if = sh -c 'command -v nvidia-smi >/dev/null && nvidia-smi -L >/dev/null 2>&1'
exec = sh -c 'nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits 2>/dev/null | head -n1 | { IFS=", " read -r utilization temperature; echo "󰢮 $utilization $temperature°C"; }'
interval = 2
format = <label>
format-background = ${colors.dark-brown}
label = " %output% "


[module/cpu]
type = internal/cpu
interval = 0.7
format = <label>
format-background = ${colors.chocolate}
label = "  %percentage%% "

[module/memory]
type = internal/memory
format = <label>
format-background = ${colors.chocolate}
label = " 󰍛 %percentage_used:2%% "


[fs-base]
type = internal/fs
fixed-values = true
spacing = 4
warn-percentage = 90
format-mounted-background = ${colors.dark-brown}
format-mounted = <label-mounted>

[module/rootfs]
inherit = fs-base
mount-0 = /
label-mounted = " / %free%"
format-unmounted = <label-unmounted>
label-unmounted = " / ?"

[module/homefs]
inherit = fs-base
mount-0 = /home
label-mounted = "  %free% "
label-unmounted = "  ?"



[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout>
format-background = ${colors.chocolate}
label-layout = "  %layout% "


[module/battery]
type = internal/battery
battery = BAT0
adaptater = AC

poll-interval = 5
low-at = 10

; Global
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Discharging specific format
format-discharging = <ramp-capacity> <label-discharging>%
format-discharging-padding = 1
format-discharging-background = ${colors.dark-brown}
format-discharging-foreground = ${colors.accent}
label-discharging = %percentage%

; Charging animation
format-charging = <animation-charging>
format-charging-padding = 1
format-charging-background = ${colors.dark-brown}
format-charging-foreground = ${colors.yellow}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 500

; Low battery
format-low = <ramp-capacity><label-low>
format-low-padding = 1
format-low-background = ${colors.dark-brown}
;format-low-background = ${colors.red}

; Fully charged
format-full = <label-full>
format-full-padding = 1
format-full-background = ${colors.dark-brown}
label-full = 


; Requires to add the user to the video group
[module/backlight]
type = internal/backlight
card = intel_backlight
;output = eDP-1
format = <ramp>
ramp-0 = %{T3}🌑%{T-}
ramp-1 = %{T3}🌘%{T-}
ramp-2 = %{T3}🌗%{T-}
ramp-3 = %{T3}🌖%{T-}
ramp-4 = %{T3}🌕%{T-}
; Keeps a scrollable area in case ramp icon fails
format-background = ${colors.dark-brown}
enable-scroll = true
; 970 ~5% of max brightness. allow to go that low when scrolling down
scroll-up = brightnessctl -q -d intel_backlight -n 970 set 10%+
scroll-down = brightnessctl -q -d inter_backlight -n 970 set 10%-


[module/tray]
type = internal/tray
tray-background = ${colors.chocolate}
tray-size = 100%


[module/time]
type = internal/date
interval = 60
date = %a %d.%m %H:%M
format = <label>
format-background = ${colors.dark-brown}
label = " 󰥔 %date%"

; MET Norway forecast for Trondheim
[module/weather]
type = custom/script
exec = sh -c 'j=$(curl -fsS --max-time 8 -A "polybar-weather/1.0" "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=??.???&lon=??.???") || { echo "󰖐 --°C"; exit 0; }; temperature=$(echo "$j" | jq -r ".properties.timeseries[0].data.instant.details.air_temperature"); echo "󰖐  $temperature°C"'
interval = 600
format = <label>
format-background = ${colors.dark-brown}
label = " %output% "
